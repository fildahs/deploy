x-api-secrets:
  SECRET_KEY: ${SECRET_KEY}
  QDRANT_API_KEY: ${QDRANT_API_KEY}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  BREVO_API_KEY: ${BREVO_API_KEY:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  OPENFDA_API_KEY: ${OPENFDA_API_KEY:-}
  PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
  PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY:-}
  OPAY_SECRET_KEY: ${OPAY_SECRET_KEY:-}
  OPAY_PUBLIC_KEY: ${OPAY_PUBLIC_KEY:-}
  OPAY_MERCHANT_ID: ${OPAY_MERCHANT_ID:-}
  BILLING_TRIAL_KEY: ${BILLING_TRIAL_KEY:-}
  MEDIA_S3_ACCESS_KEY_ID: ${MEDIA_S3_ACCESS_KEY_ID:-}
  MEDIA_S3_SECRET_ACCESS_KEY: ${MEDIA_S3_SECRET_ACCESS_KEY:-}
services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:-admin@fildah.com}
    ports:
    - 80:80
    - 443:443
    volumes:
    - ./Caddyfile:/etc/caddy/Caddyfile:ro
    - caddy_data:/data
    - caddy_config:/config
    depends_on:
    - api
    - auth-web
    - fildah-web
  api:
    image: ${FILDAH_API_IMAGE:?Select the exact released API image}
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY}
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      OPENFDA_API_KEY: ${OPENFDA_API_KEY:-}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY:-}
      OPAY_SECRET_KEY: ${OPAY_SECRET_KEY:-}
      OPAY_PUBLIC_KEY: ${OPAY_PUBLIC_KEY:-}
      OPAY_MERCHANT_ID: ${OPAY_MERCHANT_ID:-}
      BILLING_TRIAL_KEY: ${BILLING_TRIAL_KEY:-}
      MEDIA_S3_ACCESS_KEY_ID: ${MEDIA_S3_ACCESS_KEY_ID:-}
      MEDIA_S3_SECRET_ACCESS_KEY: ${MEDIA_S3_SECRET_ACCESS_KEY:-}
      DEBUG: 'False'
      ALLOWED_HOSTS: api.fildah.com,console.fildah.com
      ALLOWED_ORIGINS: https://auth.fildah.com,https://www.fildah.com,https://index.fildah.com,https://console.fildah.com,https://api.fildah.com
      AUTH_ORIGINS: https://auth.fildah.com
      FILDAH_ORIGINS: https://www.fildah.com
      DATABASE_URL: postgres://${POSTGRES_USER:-fildah}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-fildah}
      DATABASE_SSL_REQUIRE: 'False'
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: RxChat
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      MEDIA_STORAGE_BACKEND: ${MEDIA_STORAGE_BACKEND:-filesystem}
      MEDIA_S3_BUCKET: ${MEDIA_S3_BUCKET:-}
      MEDIA_S3_REGION: ${MEDIA_S3_REGION:-}
      MEDIA_S3_ENDPOINT_URL: ${MEDIA_S3_ENDPOINT_URL:-}
      MEDIA_S3_DEFAULT_ACL: ${MEDIA_S3_DEFAULT_ACL:-}
      MEDIA_S3_QUERYSTRING_AUTH: ${MEDIA_S3_QUERYSTRING_AUTH:-True}
      MEDIA_S3_CUSTOM_DOMAIN: ${MEDIA_S3_CUSTOM_DOMAIN:-}
      INDEX_ORIGINS: https://index.fildah.com
      CARE_ORIGINS: ''
      MOBILE_REDIRECT_URIS: ''
    volumes:
    - django_media:/app/media
    depends_on:
    - postgres
    - qdrant
    - redis
    expose:
    - '8000'
  worker:
    image: ${FILDAH_WORKER_IMAGE:?Select the exact released worker image}
    command: celery -A config worker --loglevel=info --concurrency=1
    restart: unless-stopped
    mem_limit: 2.5g
    cpus: '1'
    environment:
      SECRET_KEY: ${SECRET_KEY}
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      OPENFDA_API_KEY: ${OPENFDA_API_KEY:-}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY:-}
      OPAY_SECRET_KEY: ${OPAY_SECRET_KEY:-}
      OPAY_PUBLIC_KEY: ${OPAY_PUBLIC_KEY:-}
      OPAY_MERCHANT_ID: ${OPAY_MERCHANT_ID:-}
      BILLING_TRIAL_KEY: ${BILLING_TRIAL_KEY:-}
      MEDIA_S3_ACCESS_KEY_ID: ${MEDIA_S3_ACCESS_KEY_ID:-}
      MEDIA_S3_SECRET_ACCESS_KEY: ${MEDIA_S3_SECRET_ACCESS_KEY:-}
      DEBUG: 'False'
      ALLOWED_HOSTS: api.fildah.com,console.fildah.com
      DATABASE_URL: postgres://${POSTGRES_USER:-fildah}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-fildah}
      DATABASE_SSL_REQUIRE: 'False'
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: RxChat
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      MEDIA_STORAGE_BACKEND: ${MEDIA_STORAGE_BACKEND:-filesystem}
      MEDIA_S3_BUCKET: ${MEDIA_S3_BUCKET:-}
      MEDIA_S3_REGION: ${MEDIA_S3_REGION:-}
      MEDIA_S3_ENDPOINT_URL: ${MEDIA_S3_ENDPOINT_URL:-}
      MEDIA_S3_DEFAULT_ACL: ${MEDIA_S3_DEFAULT_ACL:-}
      MEDIA_S3_QUERYSTRING_AUTH: ${MEDIA_S3_QUERYSTRING_AUTH:-True}
      MEDIA_S3_CUSTOM_DOMAIN: ${MEDIA_S3_CUSTOM_DOMAIN:-}
      ALLOWED_ORIGINS: https://auth.fildah.com,https://www.fildah.com,https://index.fildah.com,https://console.fildah.com,https://api.fildah.com
      AUTH_ORIGINS: https://auth.fildah.com
      FILDAH_ORIGINS: https://www.fildah.com
      INDEX_ORIGINS: https://index.fildah.com
      CARE_ORIGINS: ''
      MOBILE_REDIRECT_URIS: ''
    volumes:
    - django_media:/app/media
    depends_on:
    - postgres
    - qdrant
    - redis
  attachment-worker:
    extends:
      service: worker
    command: celery -A config worker --loglevel=info --queues=attachments --concurrency=4
      --prefetch-multiplier=1 --max-tasks-per-child=50
    mem_limit: 1.5g
    cpus: '2'
    environment:
      ALLOWED_ORIGINS: https://auth.fildah.com,https://www.fildah.com,https://index.fildah.com,https://console.fildah.com,https://api.fildah.com
      AUTH_ORIGINS: https://auth.fildah.com
      FILDAH_ORIGINS: https://www.fildah.com
      INDEX_ORIGINS: https://index.fildah.com
      CARE_ORIGINS: ''
      MOBILE_REDIRECT_URIS: ''
    image: ${FILDAH_WORKER_IMAGE:?Select the exact released worker image}
  billing-beat:
    extends:
      service: worker
    command: celery -A config beat --loglevel=info --schedule=/app/media/scheduler/celerybeat-schedule
    mem_limit: 256m
    cpus: '0.25'
    environment:
      ALLOWED_ORIGINS: https://auth.fildah.com,https://www.fildah.com,https://index.fildah.com,https://console.fildah.com,https://api.fildah.com
      AUTH_ORIGINS: https://auth.fildah.com
      FILDAH_ORIGINS: https://www.fildah.com
      INDEX_ORIGINS: https://index.fildah.com
      CARE_ORIGINS: ''
      MOBILE_REDIRECT_URIS: ''
    image: ${FILDAH_WORKER_IMAGE:?Select the exact released worker image}
  auth-web:
    image: ${AUTH_WEB_IMAGE:-ghcr.io/fildahs/auth-web:main}
    restart: unless-stopped
    expose:
    - '80'
  fildah-web:
    image: ${FILDAH_WEB_IMAGE:-ghcr.io/fildahs/fildah-web:main}
    restart: unless-stopped
    expose:
    - '80'
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fildah}
      POSTGRES_USER: ${POSTGRES_USER:-fildah}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
    - postgres_data:/var/lib/postgresql/data
    ports:
    - 127.0.0.1:5432:5432
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
    - redis_data:/data
    expose:
    - '6379'
  qdrant:
    image: qdrant/qdrant:v1.17.1
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    volumes:
    - qdrant_data:/qdrant/storage
    ports:
    - 127.0.0.1:6333:6333
volumes:
  redis_data: null
  postgres_data: null
  qdrant_data: null
  django_media: null
  caddy_data: null
  caddy_config: null
name: ${COMPOSE_PROJECT_NAME:-deploy}
