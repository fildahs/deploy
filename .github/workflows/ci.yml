name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test deployment authorization and CI gate
        run: python3 -m unittest discover -s tests -v
      - name: Validate local Compose configuration without secrets
        run: docker compose --env-file /dev/null -f compose.local.yml config --quiet
